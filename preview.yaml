# What tools/preview.py shows (docs/PREVIEW.md of the plugins repository): the sensor of tonight's films, as Home
# Assistant has it, with a film that has started and the fifteen after it; a guide that is old; no film left; and the
# tile before a sensor is chosen. Moments are made from the time of the render ("{epoch+25m}" is in 25 minutes).
time_zone: Europe/Rome

tiles:
  - tile: films
    name: Film stasera
    entity: sensor.film_stasera
  - tile: films
    name: Guida vecchia
    entity: sensor.film_vecchia
    sizes: [2x2, 2x3]
  - tile: films
    name: Nessun film
    entity: sensor.film_vuoto
    sizes: [2x2, 2x3]
  - tile: films
    name: Senza sensore
    sizes: [2x3]

states:
  sensor.film_stasera:
    state: "16"
    attributes:
      friendly_name: Film stasera
      stale: false
      titles:
        - Point Break - Punto di rottura
        - La giuria
        - The Italian Job
        - Il club delle prime mogli
        - Maigret e le lettere anonime
        - Il nome della rosa
        - Mission Impossible
        - La vita è bella
        - Il diavolo veste Prada
        - Interstellar
        - Nuovo Cinema Paradiso
        - Arma letale
        - Il sorpasso
        - Inception
        - Fargo
        - Amici miei
      channels: [Iris, Rai Movie, "20", La7, Top Crime, Rai 3, Italia 1, Rai 1, Canale 5, Rai 4, Cine34, Rete 4, Rai Movie, Nove, Rai 4, Cine34]
      groups: [2, 1, 2, 4, 2, 1, 2, 1, 2, 1, 2, 2, 1, 3, 1, 2]
      starts:
        - "{epoch-40m}"
        - "{epoch+10m}"
        - "{epoch+25m}"
        - "{epoch+1h}"
        - "{epoch+75m}"
        - "{epoch+80m}"
        - "{epoch+85m}"
        - "{epoch+90m}"
        - "{epoch+95m}"
        - "{epoch+100m}"
        - "{epoch+105m}"
        - "{epoch+3h}"
        - "{epoch+190m}"
        - "{epoch+200m}"
        - "{epoch+210m}"
        - "{epoch+220m}"
      genres: [Poliziesco, Thriller, Azione, Commedia, Poliziesco, Giallo, Azione, Commedia, Commedia, Fantascienza, Drammatico, Azione, Commedia, Fantascienza, Thriller, Commedia]
  sensor.film_vecchia:
    state: "2"
    attributes:
      friendly_name: Film stasera
      stale: true
      titles: [La giuria, The Gentleman]
      channels: [Rai Movie, Rai 4]
      groups: [1, 1]
      starts: ["{epoch+30m}", "{epoch+80m}"]
      genres: [Thriller, ""]
  sensor.film_vuoto:
    state: "0"
    attributes:
      friendly_name: Film stasera
      stale: false
      titles: []
      channels: []
      starts: []
      genres: []

# What Home Assistant's script film_stasera_day answers the card for another day of the week.
commands:
  "call_service:script.film_stasera_day":
    date: "2026-10-14"
    titles: [The Social Reckoning, Moana, Coyote vs Acme, Minions & Monsters]
    channels: [Arc Cinema Preston, Vue Preston, Arc Cinema Preston, Vue Preston]
    groups: [1, 2, 1, 2]
    starts: ["{epoch+1d}", "{epoch+25h}", "{epoch+26h}", "{epoch+27h}"]
    genres: ["", "", "", ""]

cards:
  - { card: movies, entity: sensor.film_stasera }
